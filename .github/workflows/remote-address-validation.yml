name: Remote address regression proof
on:
  push:
    branches: [codex/validate-remote-addresses]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Remote rules
        run: Tests/checks/run-all.sh -v remote-rules home-model home-records protocol
      - name: Remote rule mutants
        run: Tests/checks/run-all.sh --mutants remote-rules
